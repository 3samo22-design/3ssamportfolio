<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدير البورتفوليو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1220;--red:#E0243C;--bg:#F0F2F6;--line:#D9DEE7;--ink:#121A2B;--mut:#667085;font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{overflow:auto;background:var(--navy);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside h1{font-size:18px;font-weight:800;padding:0 8px 14px}
.nv{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:10px;color:#c9d1e0;font-weight:600;text-align:right}
.nv[draggable="true"]{cursor:grab}.nv.sec-drag{opacity:.35}.nv.sec-over{outline:2px dashed #ff8292;outline-offset:-2px}.nv:hover{background:rgba(255,255,255,.07)}.nv.on{background:var(--red);color:#fff}.nv small{opacity:.75;font-weight:400}
.sp{flex:1}.fi{font-size:12px;color:#9aa6bd;padding:8px;word-break:break-all}
.bt{padding:12px;border-radius:10px;font-weight:800;text-align:center;border:1px solid rgba(255,255,255,.25)}
.bt.pr{background:var(--red);border-color:var(--red)}.bt:disabled{opacity:.4;cursor:default}
main{padding:28px clamp(16px,3vw,40px) 80px;min-width:0}
.hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.hd h2{font-size:28px;font-weight:800}.hd p{color:var(--mut);font-size:14px}
.bk{color:var(--red);font-weight:800;margin-inline-end:4px}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(var(--min,190px),1fr))}
.cd{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cd.drg{opacity:.35}.cd.ov{outline:2px dashed var(--red)}
.th{position:relative;aspect-ratio:var(--ar,4/5);background:#e7eaf0;display:grid;place-items:center;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.lg .th img{object-fit:contain;padding:14px}
.lg .th{background:repeating-conic-gradient(#e4e7ee 0 25%,#f6f7fa 0 50%) 0 0/16px 16px}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--navy);color:#fff;font-size:12px;padding:2px 10px;border-radius:99px}
.tag.cv{background:var(--red)}
.bd{padding:10px;display:grid;gap:8px}
.bd input,.bd select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fafbfc;font:inherit;font-size:14px}
.ac{display:flex;flex-wrap:wrap;gap:6px}
.ac button{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}
.ac button:hover{background:var(--navy);color:#fff;border-color:var(--navy)}.ac .dn:hover{background:var(--red);border-color:var(--red)}
.add{border:2px dashed #b8c0cf;border-radius:12px;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center;min-height:200px;color:var(--mut);cursor:pointer;padding:16px}
.add:hover,.add.ov{border-color:var(--red);color:var(--red)}.add span{font-size:34px;line-height:1}.add b{color:var(--ink)}
.lk{display:grid;gap:14px;max-width:560px}.lk label{display:grid;gap:6px;font-weight:600}
.lk input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;direction:ltr;text-align:left}
#wel{position:fixed;inset:0;background:var(--navy);color:#fff;display:grid;place-items:center;z-index:50;padding:20px}
#wel.hide{display:none}
.box{border:2px dashed #4b5870;border-radius:20px;padding:56px 40px;text-align:center;max-width:520px;display:grid;gap:14px;justify-items:center}
.box.ov{border-color:var(--red)}.box h1{font-size:30px;font-weight:800}.box p{color:#aab5ca;line-height:1.7}
.box .bt{padding:12px 28px;background:var(--red);border-color:var(--red)}
#tt{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;display:flex;gap:14px;align-items:center;transition:transform .3s;z-index:90}
#tt.on{transform:translate(-50%,0)}#tt button{color:#ff8a99;font-weight:800}
#bz{position:fixed;inset:0;background:rgba(240,242,246,.7);display:none;place-items:center;z-index:80;font-weight:800}#bz.on{display:grid}
dialog{border:0;border-radius:16px;padding:20px;max-width:min(94vw,640px);width:100%;background:#fff;color:var(--ink);margin:auto}
dialog::backdrop{background:rgba(5,10,20,.65)}
#cv{display:block;margin:0 auto;max-width:100%;border-radius:8px;cursor:grab;touch-action:none;background:repeating-conic-gradient(#e4e7ee 0 25%,#f6f7fa 0 50%) 0 0/16px 16px}
.cr{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:center;justify-content:center}
.cr button{padding:6px 14px;border:1px solid var(--line);border-radius:99px;font-weight:600}.cr button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cr input[type=range]{accent-color:var(--red);width:160px}
.fo{display:flex;gap:10px;justify-content:center}.fo button{padding:10px 24px;border-radius:10px;font-weight:800;border:1px solid var(--line)}.fo .pr{background:var(--red);color:#fff;border-color:var(--red)}
.gh{margin:22px 0 6px;font-size:15px;font-weight:800}.pn{max-width:680px;display:grid;gap:10px}.pn .al{display:grid;gap:6px;font-weight:600;font-size:14px}
.pn textarea,.pn select,.pn input:not([type=color]):not([type=range]){width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:14px}
.sr{display:grid;grid-template-columns:80px 1fr 60px;gap:8px}.rw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.rw>select{flex:1;min-width:140px}
.rw button{padding:8px 14px;border:1px solid var(--line);border-radius:8px;font-weight:600;background:#fff}.rw button:hover{background:var(--navy);color:#fff}
.rw label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}.cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cl label{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
input[type=color]{width:44px;height:30px;border:0;padding:0;background:none;cursor:pointer}.tg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.pv{background:var(--navy);padding:12px 16px;border-radius:8px;font-size:20px;overflow:hidden;white-space:nowrap}.bp{background:var(--navy);color:#fff;border-radius:10px;padding:16px;display:flex;align-items:center;min-height:72px;font-weight:800}
.bp img{width:auto;display:block}.fv{width:40px;height:40px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}.hr figure{display:grid;gap:8px;width:200px}
.hr img{width:100%;aspect-ratio:1;object-fit:contain;background:#e7eaf0;border-radius:10px}.hn{color:var(--mut);line-height:1.7}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}.seg button{padding:8px 24px;font-weight:700}.seg .on{background:var(--navy);color:#fff}
.cb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}.cb>b{font-size:14px;margin-inline-end:4px}
.ch{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 14px;padding-inline-end:6px;font-size:14px;font-weight:600}
.ch small{color:var(--mut)}.ch button{width:24px;height:24px;border-radius:50%;font-size:13px;line-height:1}.ch button:hover{background:var(--navy);color:#fff}.ch .x:hover{background:var(--red)}
.chn{border:2px dashed #b8c0cf;border-radius:99px;padding:4px 14px;font-weight:700;color:var(--mut)}.chn:hover{border-color:var(--red);color:var(--red)}
#pd{max-width:380px}#pd b{font-size:16px}#pd input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:14px 0;font-size:15px}
.sa{display:flex;gap:8px;margin-inline-start:auto}.sa button{padding:6px 14px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;background:#fff}.sa button:hover{background:var(--navy);color:#fff}.sa .dn:hover{background:var(--red);border-color:var(--red)}
.nv.ns{border:1px dashed rgba(255,255,255,.3);margin-top:8px;justify-content:center;color:#fff}.nv.ns:hover{border-color:var(--red);background:rgba(224,36,60,.15)}
#sd{max-width:420px}#sd b{font-size:16px}#sd input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:14px 0;font-size:15px}#sd .seg{width:100%}#sd .seg button{flex:1;padding:8px 10px}#sd .hn{margin:10px 0 16px;font-size:13px}
select.up{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:14px;min-width:260px;max-width:100%}.cb>.hn{font-size:13px}
.fl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}.fs{gap:8px}.fs select{min-width:110px;padding:6px 8px;font-size:13px}.fs label{font-size:13px}.fs input[type=range]{width:90px;accent-color:var(--red)}.fs button{padding:4px 10px}.pv2{background:var(--navy);color:#fff;padding:2px 8px;border-radius:6px;font-size:16px;line-height:1.6;min-width:58px;max-width:90px;overflow:hidden;white-space:nowrap;text-align:center}
@media(max-width:800px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}aside h1,.fi,.sp{display:none}.nv{padding:8px 12px}.bt{padding:8px 12px}}
</style></head><body>
<div id="wel"><label class="box" id="bx"><h1>افتح ملف البورتفوليو</h1><p>اسحب ملف الـ HTML بتاعك هنا أو اختاره من جهازك.<br>كل التعديلات بتحصل على جهازك، ومفيش حاجة بتترفع لأي مكان.</p><span class="bt">اختيار الملف</span><input type="file" id="pf" accept=".html,.htm" hidden></label></div>
<div id="app"><aside><h1>مدير البورتفوليو</h1><div id="nv"></div><div class="sp"></div><div class="fi" id="fi"></div><button class="bt" id="un">تراجع</button><button class="bt" id="pw">معاينة الموقع</button><button class="bt pr" id="ex">حفظ وتنزيل الملف المحدّث</button><div class="fi" id="st"></div></aside><main id="mn"></main></div>
<dialog id="cr"><canvas id="cv"></canvas><div class="cr" id="rt"></div><div class="cr"><span>تكبير</span><input type="range" id="zm" min="1" max="3" step=".01" value="1"><button id="rr">تدوير ↻</button></div><div class="fo"><button id="cx">إلغاء</button><button class="pr" id="ca">تطبيق</button></div></dialog>
<dialog id="pd"><b id="pdt"></b><input id="pdi" dir="auto" autocomplete="off"><div class="fo"><button id="pdx">إلغاء</button><button class="pr" id="pdo">تأكيد</button></div></dialog>
<dialog id="sd"><b>قسم جديد</b><input id="sdn" dir="auto" placeholder="اسم القسم" autocomplete="off"><label class="hn" for="sdz" style="display:block;margin:0 0 6px;font-weight:700">المقاس الأساسي للقسم</label><select id="sdz" class="up" style="width:100%"></select><p id="sdh" class="hn"></p><div class="fo"><button id="sdx">إلغاء</button><button class="pr" id="sdo">إنشاء القسم</button></div></dialog>
<div id="tt"><span id="tm"></span><button id="tu" hidden>تراجع</button></div><div id="bz">جاري معالجة الصور…</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TABS=[['social','السوشيال ميديا','بوستات · اختار مقاس الرفع من الشريط اللي تحت'],['campaigns','الحملات','كل حملة ليها فولدر صور · أول صورة هي الغلاف'],['banners','البانرات','المقاس المناسب 2250 × 969'],['logos','اللوجوهات','يفضّل PNG بخلفية شفافة'],['links','الروابط','روابط التواصل في آخر الصفحة'],['text','نصوص الموقع','عدّل أي نص · وجنب كل نص الخط والوزن واللون بتوعه'],['brand','الشعار والهيرو','شعار القائمة وأيقونة التبويب وصور الهيرو'],['style','الخطوط والألوان','ألوان الموقع والخط العام']];
const LISTS=['social','campaigns','banners','logos'],RE=/(<script type="application\/json" id="site-data">)([\s\S]*?)(<\/script>)/;
const BASE=TABS.map(t=>t.slice());
let GM=null,RAW='',NAME='',SD=null,tab='social',open=null,hist=[],D=false,cur=[],tmr;
const src=a=>SD.assets[a]||'';
const folderOf=c=>{const l=(c.imgs&&c.imgs.length)?c.imgs.slice():SD.campaigns.filter(p=>p.t===c.t).map(p=>p.a);return[c.a,...[...new Set(l)].filter(a=>a!==c.a)]};
const setF=(c,l)=>{c.imgs=l;c.a=l[0]};
const dims=(w,h)=>{const q=w/h;if(q>=1){const W=Math.min(110,Math.round(40*q));return{w:W,h:Math.round(W/q)}}const H=Math.min(75,Math.round(60/q));return{w:Math.round(H*q),h:H}};
const put=(it,old,n)=>{if(tab==='campaigns'){const l=folderOf(it);l[l.indexOf(old)]=n;setF(it,l)}else it.a=n};
function toast(m,u){$('#tm').textContent=m;$('#tu').hidden=!u;$('#tt').classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>$('#tt').classList.remove('on'),u?6000:3000)}
const busy=v=>$('#bz').classList.toggle('on',v);
function mark(){D=true;$('#st').textContent='فيه تعديلات لسه متنزلتش'}
const snap=()=>{hist.push(JSON.stringify(Object.fromEntries([...LISTS,'links','cats','secs','tl','sectionOrder'].map(k=>[k,SD[k]]))));if(hist.length>40)hist.shift()};
function undo(){if(GM)return toast('التراجع مش متاح في الوضع العام');if(!hist.length)return toast('مفيش حاجة للتراجع عنها');Object.assign(SD,JSON.parse(hist.pop()));rebuildTabs();if(!TABS.some(t=>t[0]===tab))tab='social';if(open&&!SD.campaigns.some(c=>c.id===open))open=null;mark();render();toast('تم التراجع')}
const load1=s=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=s});
async function proc(f,max,alpha){const u=URL.createObjectURL(f),im=await load1(u),nw=im.naturalWidth||300,nh=im.naturalHeight||150,k=Math.min(1,max/Math.max(nw,nh)),w=Math.round(nw*k),h=Math.round(nh*k),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');if(!alpha){g.fillStyle='#fff';g.fillRect(0,0,w,h)}g.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);return{src:c.toDataURL(alpha?'image/png':'image/jpeg',.88),w,h}}
async function add(files,c){if(GM)return;if(PT.includes(tab)||tab==='links')return;const fs=[...files].filter(f=>/^image\//.test(f.type));if(!fs.length)return;snap();busy(true);const lg=tab==='logos';
 for(const f of fs){try{const r=await procU(f,lg),a=uid();SD.assets[a]=r.src;
  if(c){const l=folderOf(c);l.push(a);setF(c,l)}
  else{const it={id:uid(),a};if(!lg){it.t=f.name.replace(/\.[^.]+$/,'');it.c=tab==='social'?(SD.social.at(-1)?.c||'Social media'):''}if(tab==='campaigns')it.imgs=[a];if(lg)Object.assign(it,dims(r.w,r.h));{const z=lg?null:upSize();if(z)it.z=z.id}SD[tab].push(it)}}catch(e){}}
 busy(false);mark();render()}
const pick=cb=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()};
async function replace(it,old,f){busy(true);try{const lg=tab==='logos',r=await procU(f,lg),n=uid();SD.assets[n]=r.src;snap();put(it,old,n);if(!lg&&tab!=='campaigns'){const z=upSize();if(z)it.z=z.id;else delete it.z}if(lg)Object.assign(it,dims(r.w,r.h));mark()}catch(e){toast('الصورة دي مش مقروءة')}busy(false);render()}
function render(){
 if(GM)return gRender();
 const c=open&&SD.campaigns.find(x=>x.id===open),T=TABS.find(t=>t[0]===tab);
 $('#nv').innerHTML=TABS.map(([k,l])=>`<button draggable="${sectionKeys().includes(k)}" class="nv ${k===tab?'on':''}" data-t="${k}">${esc(l)}<small>${LISTS.includes(k)?SD[k].length:''}</small></button>`).join('')+'<button class="nv ns" data-sec="add">＋ قسم جديد</button>';
 let h=`<div class="hd"><h2>${c?`<button class="bk" data-a="back">‹ ${esc(TABS.find(t=>t[0]==='campaigns')[1])}</button>`+esc(c.t):esc(T[1])}</h2><p>${c?folderOf(c).length+' صورة · اسحب الصور لترتيبها':T[2]}</p>${LISTS.includes(tab)&&!c?`<span class="sa"><button data-sec="ren">✎ تعديل اسم القسم</button>${SD.secs.some(x=>x.k===tab)?'<button class="dn" data-sec="del">حذف القسم</button>':''}</span>`:''}</div>`;
 if(PT.includes(tab)){$('#mn').innerHTML=h+panel();if(tab==='text')F.forEach((_,i)=>pv('f'+i));return}
 if(tab==='links'){const K=SD.links;h+=`<div class="lk">${[['instagram','إنستجرام'],['facebook','فيسبوك'],['whatsapp','واتساب (رقم بكود الدولة أو رابط)'],['linkedin','لينكدإن']].map(([k,l])=>`<label>${l}<input data-l="${k}" value="${esc(K[k])}"></label>`).join('')}</div>`;$('#mn').innerHTML=h;return}
 cur=c?folderOf(c).map((a,i)=>({it:c,a,i})):SD[tab].map((it,i)=>({it,a:it.a,i}));
 const lg=tab==='logos',tt=secType(tab),bn=tt==='banner',st=tt==='story';
 h+=`${tab==='social'&&!c?catBar():''}${!c&&tab!=='campaigns'&&!lg?sizeBar():''}<div class="g ${lg?'lg':''}" id="gr" style="--min:${gridMeta(lg,bn,st).min}px;--ar:${gridMeta(lg,bn,st).ar}"><label class="add" id="ad"><input type="file" accept="image/*" multiple hidden id="af"><span>＋</span><b>${c?'إضافة صور للحملة':tab==='campaigns'?'حملة جديدة':'إضافة صور'}</b><small>اضغط أو اسحب الصور هنا</small></label>`;
 h+=cur.map(({it,a,i})=>{const top=!c&&tab==='campaigns';
  return`<div class="cd" draggable="true" data-i="${i}"><div class="th">${top?`<button data-a="open" style="position:absolute;inset:0;z-index:1" aria-label="فتح"></button>`:''}<img src="${src(a)}" alt="" draggable="false">${top?`<span class="tag">${folderOf(it).length} صور</span>`:''}${c&&i===0?'<span class="tag cv">الغلاف</span>':''}${!c&&!top&&!lg&&SZ_BY[it.z]?`<span class="tag">${SZ_BY[it.z].s}</span>`:''}</div><div class="bd">${lg||c?'':`<input data-f="t" dir="auto" value="${esc(it.t)}" placeholder="العنوان">`}${tab==='social'?`<select data-f="c" aria-label="التصنيف">${catOpts(it.c)}</select>`:''}<div class="ac">${top?'<button data-a="open">فتح</button>':''}<button data-a="rep">استبدال</button><button data-a="ed">تعديل</button>${c&&i>0?'<button data-a="cov">غلاف</button>':''}<button class="dn" data-a="rm">حذف</button></div></div></div>`}).join('')+'</div>';
 $('#mn').innerHTML=h}
$('#nv').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;open=null;render()}};
$('#mn').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='back'){open=null;return render()}
 const card=b.closest('.cd'),x=cur[+card.dataset.i],c=open&&SD.campaigns.find(z=>z.id===open);
 if(a==='open'){open=x.it.id;render()}
 else if(a==='rep')pick(f=>replace(x.it,x.a,f));
 else if(a==='ed')crop(x.it,x.a);

 ch.forEach(k=>{const n=S.v[k];h=h.split('@@'+k+'r@@').join(hx(n).join(',')).split('@@'+k+'q@@').join(n.slice(1)).split('@@'+k+'@@').join(n)});return h}
function build(){if(GM)return gBuild();syncSecs();const ref=new Set(),as={};LISTS.forEach(k=>SD[k].forEach(i=>{ref.add(i.a);(i.imgs||[]).forEach(a=>ref.add(a))}));Object.keys(SD.assets).forEach(a=>{if(ref.has(a))as[a]=SD.assets[a]});
 let h=RAW;if(P.dirty){const e=h.indexOf('<script type="application/json" id="site-data">'),i=h.indexOf('<body>')+6;h=h.slice(0,i)+P.doc.body.innerHTML+h.slice(e)}
 const j=JSON.stringify({...SD,assets:as}).replace(/</g,'\\u003c');
 h=h.replace(RE,(m,a,b,c)=>a+j+c).replace(/const BUILD_ID='[^']*'/,()=>"const BUILD_ID='b"+Date.now()+"'");
 h=h.replace(/stats:\s*(?:\(window\.PM_ST\|\|)?\[\[[\s\S]*?\]\]\)?\s*,\s*clients:/,()=>'stats:'+JSON.stringify(P.stats)+',\n clients:');
 if(P.email)h=h.replace(/email:'[^']*'/,()=>"email:'"+P.email.replace(/'/g,"\\'")+"'");
 if(P.ttl)h=h.replace(/<title>[\s\S]*?<\/title>/,()=>'<title>'+esc(P.ttl)+'</title>').replace(/(property="og:title" content=")[^"]*/,(m,a)=>a+esc(P.ttl));
 if(P.fav!==P.fav0)h=h.replace(/<link rel="icon" href="[^"]*"/,()=>'<link rel="icon" href="'+P.fav+'"');
 if(P.hO!==P.hO0)h=h.replace(/HERO_O='[^']*'/,()=>"HERO_O='"+P.hO+"'");if(P.hS!==P.hS0)h=h.replace(/HERO_S='[^']*'/,()=>"HERO_S='"+P.hS+"'");
 h=recolor(h).replace(/<style id="pm-style">[\s\S]*?<\/style>\s*/,'').replace(/<link id="pm-fonts"[^>]*>\s*/,'');
 const hf=fhref();h=h.replace('</head>',()=>(hf?`<link id="pm-fonts" rel="stylesheet" href="${hf}">`:'')+`<style id="pm-style">/*PM:${JSON.stringify({font:S.font,fw:S.fw,f:S.f})}*/${css()}</style></head>`);return stripLang(h)}
/* ===== generic mode: any index.html (no site-data) ===== */
const GB='h1,h2,h3,h4,h5,h6,p,a,button,li,label,figcaption,td,th,blockquote,dt,dd,summary',BGRE=/url\((['"]?)(.*?)\1\)/;
const gShort=s=>s.startsWith('data:')?'صورة مدمجة في الملف':s.length>60?'…'+s.slice(-58):s;
const gSrc=it=>it.k==='img'?(it.e.getAttribute('src')||''):((BGRE.exec(it.e.getAttribute('style')||'')||[])[2]||'');
const gSec=e=>{const s=e.parentElement&&e.parentElement.closest('section,header,footer,nav,main,[id]');return s?(s.id?'#'+s.id:s.tagName.toLowerCase()):'عام'};
function gScan(){const d=GM.doc,I=[],T=[];
 d.querySelectorAll('img[src]').forEach(e=>I.push({e,k:'img'}));
 d.querySelectorAll('[style*="url("]').forEach(e=>{if(/background(-image)?\s*:[^;]*url\(/i.test(e.getAttribute('style')))I.push({e,k:'bg'})});
 d.querySelectorAll(GB+',div,span').forEach(e=>{if(e.closest('svg,script,style,noscript,template,select,textarea'))return;
  if(e.matches(GB)){if(!e.textContent.trim()||e.querySelector(GB))return}
  else if(e.children.length||!e.textContent.trim()||(e.parentElement&&e.parentElement.closest(GB)))return;
  T.push(e)});
 GM.I=I;GM.T=T;GM.L=[...d.querySelectorAll('a[href]')].filter(a=>!a.textContent.trim())}
function loadGeneric(t,f){SD=null;GM={doc:new DOMParser().parseFromString(t,'text/html'),dt:(t.match(/^\s*<!doctype[^>]*>/i)||['<!DOCTYPE html>'])[0]};gScan();
 if(!GM.I.length&&!GM.T.length){GM=null;return toast('مش لاقي صور ولا نصوص في الملف ده')}
 NAME=f.name;hist=[];D=false;tab='gi';open=null;$('#fi').textContent=f.name+' · وضع عام · '+(t.length/1048576).toFixed(1)+' MB';$('#st').textContent='';$('#wel').classList.add('hide');gRender();toast('اتفتح الملف في الوضع العام: '+GM.I.length+' صورة · '+GM.T.length+' نص')}
function gRender(){const I=GM.I,T=GM.T,d=GM.doc,tabs=[['gi','الصور',I.length],['gt','النصوص',T.length],['gp','الصفحة والروابط','']],H={gi:'كل الصور في الملف · استبدل أو احذف أو عدّل الوصف',gt:'كل النصوص · عدّل أي نص مباشرة',gp:'عنوان الصفحة ووصفها وروابط الأيقونات'};
 $('#nv').innerHTML=tabs.map(([k,l,n])=>`<button class="nv ${k===tab?'on':''}" data-t="${k}">${l}<small>${n}</small></button>`).join('');
 let h=`<div class="hd"><h2>${tabs.find(t=>t[0]===tab)[1]}</h2><p>${H[tab]}</p></div>`;
 if(tab==='gi'){h+=`<div class="g lg" style="--min:210px;--ar:4/3">`+I.map((it,i)=>{const s=gSrc(it);return`<div class="cd"><div class="th"><img src="${esc(s)}" alt="" onerror="this.style.opacity=.15"></div><div class="bd"><small class="hn" dir="ltr" style="word-break:break-all">${esc(gShort(s))}</small>${it.k==='img'?`<input data-ga="${i}" dir="auto" value="${esc(it.e.getAttribute('alt')||'')}" placeholder="الوصف (alt)">`:'<small class="hn">صورة خلفية</small>'}<div class="ac"><button data-g="rep" data-i="${i}">استبدال</button><button class="dn" data-g="rm" data-i="${i}">حذف</button></div></div></div>`}).join('')+'</div><p class="hn" style="margin-top:14px">لو الصور بتظهر باهتة، حط الأداة في نفس فولدر الـ index عشان تشوف الصور المرتبطة. أي صورة تستبدلها بتتدمج جوه الملف.</p>'}
 else if(tab==='gt'){let g='';h+='<div class="pn" style="max-width:820px">'+T.map((e,i)=>{const sc=gSec(e);let x='';if(sc!==g){x=`<h3 class="gh">${esc(sc)}</h3>`;g=sc}const v=e.innerHTML.trim(),a=e.tagName==='A';return x+`<div class="fl"><label class="al">&lt;${e.tagName.toLowerCase()}&gt;<textarea data-gt="${i}" dir="auto" rows="${Math.min(6,Math.ceil(v.length/70)||1)}">${esc(v)}</textarea></label>${a?`<input data-gh="${i}" dir="ltr" value="${esc(e.getAttribute('href')||'')}" placeholder="الرابط">`:''}</div>`}).join('')+'</div>'}
 else{const m=d.querySelector('meta[name=description]');h+=`<div class="pn"><label class="al">عنوان الصفحة (Title)<input data-gm="title" dir="auto" value="${esc(d.title)}"></label><label class="al">وصف الصفحة (Description)<textarea data-gm="desc" dir="auto" rows="3">${esc(m?m.content:'')}</textarea></label>${GM.L.length?'<h3 class="gh">روابط الأيقونات (بدون نص)</h3>'+GM.L.map((a,i)=>`<label class="al" dir="ltr">${esc(gSec(a))} · icon<input data-gl="${i}" dir="ltr" value="${esc(a.getAttribute('href'))}"></label>`).join(''):''}</div>`}
 $('#mn').innerHTML=h}
$('#mn').addEventListener('input',e=>{if(!GM)return;const t=e.target,d=t.dataset;
 if(d.gt!==undefined)GM.T[+d.gt].innerHTML=t.value;
 else if(d.gh!==undefined)GM.T[+d.gh].setAttribute('href',t.value);
 else if(d.gl!==undefined)GM.L[+d.gl].setAttribute('href',t.value);
 else if(d.ga!==undefined)GM.I[+d.ga].e.setAttribute('alt',t.value);
 else if(d.gm==='title')GM.doc.title=t.value;
 else if(d.gm==='desc'){let m=GM.doc.querySelector('meta[name=description]');if(!m){m=GM.doc.createElement('meta');m.name='description';GM.doc.head.append(m)}m.content=t.value}
 else return;mark()});
$('#mn').addEventListener('click',e=>{if(!GM)return;const b=e.target.closest('[data-g]');if(!b)return;const i=+b.dataset.i,it=GM.I[i];
 if(b.dataset.g==='rep')pick(async f=>{busy(true);try{const r=await proc(f,2250,/png|svg|webp|gif/.test(f.type));
  if(it.k==='img'){it.e.setAttribute('src',r.src);it.e.removeAttribute('srcset');const pp=it.e.parentElement;if(pp&&pp.tagName==='PICTURE')pp.querySelectorAll('source').forEach(x=>x.remove())}
  else it.e.setAttribute('style',it.e.getAttribute('style').replace(BGRE,()=>`url("${r.src}")`));mark()}catch(_){toast('الصورة دي مش مقروءة')}busy(false);gRender()});
 else if(b.dataset.g==='rm'){if(!confirm('تحذف الصورة دي؟'))return;if(it.k==='img')it.e.remove();else it.e.setAttribute('style',it.e.getAttribute('style').replace(BGRE,'none'));GM.I.splice(i,1);mark();gRender()}});
function gBuild(){return GM.dt+'\n'+GM.doc.documentElement.outerHTML}
/* file in / out */
async function loadPortfolio(f){const t=await f.text(),m=t.match(RE);if(!m)return loadGeneric(t,f);try{SD=JSON.parse(m[2])}catch(e){return loadGeneric(t,f)}
 if(!LISTS.slice(0,4).some(k=>Array.isArray(SD[k])&&SD[k].length))return loadGeneric(t,f);GM=null;
 cats();SD.secs=SD.secs||[];SD.tl=SD.tl||{};SD.sectionOrder=SD.sectionOrder||[];SD.secs.forEach(x=>{SD[x.k]=SD[x.k]||[]});rebuildTabs();RAW=t;NAME=f.name;try{parseExtra(t)}catch(e){console.error(e)}hist=[];D=false;tab='social';open=null;$('#fi').textContent=f.name+' · '+(t.length/1048576).toFixed(1)+' MB';$('#st').textContent='';$('#wel').classList.add('hide');render()}
function exportFile(){if(!SD&&!GM)return;busy(true);setTimeout(()=>{const h=build(),l=document.createElement('a');l.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));l.download=GM?NAME:NAME.replace(/\.html?$/i,'')+'_updated.html';document.body.append(l);l.click();l.remove();D=false;busy(false);$('#st').textContent='اتنزل الملف · '+(h.length/1048576).toFixed(1)+' MB'},30)}
$('#pw').onclick=()=>{if(!SD&&!GM)return;busy(true);setTimeout(()=>{window.open(URL.createObjectURL(new Blob([build()],{type:'text/html'})));busy(false)},30)};
$('#ex').onclick=exportFile;$('#un').onclick=undo;$('#tu').onclick=()=>{undo()};
$('#pf').onchange=e=>e.target.files[0]&&loadPortfolio(e.target.files[0]);
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();if(!SD&&e.dataTransfer.files[0])loadPortfolio(e.dataTransfer.files[0])});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT/.test(document.activeElement.tagName)){e.preventDefault();undo()}});
addEventListener('beforeunload',e=>{if(D){e.preventDefault();e.returnValue=''}});
</script></body></html>
